name: Verify Roty site
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: roty-verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROTY_TEST_REDIS_SERVER: /usr/bin/redis-server
      ROTY_TEST_REDIS_CLI: /usr/bin/redis-cli
      ROTY_TEST_CHROMIUM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:server
      - run: npm run build
      - run: npm run build:local
      - run: npx playwright install --with-deps chromium
      - name: Start local production build
        run: |
          npm run start:local > /tmp/roty-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/roty-server.log
          exit 1
      - run: npm run test:http
      - run: npm run test:browser
      - name: Verify runtime stream cleanup
        run: npm run test:runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roty-verification
          path: test-results/
          retention-days: 7
